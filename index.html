                </div>

                ${searchQuery ? `
                    <div class="mb-6 p-3 bg-amber-50 text-amber-900 rounded-xl text-xs border border-amber-200 flex items-center gap-2">
                        <i data-lucide="filter" class="w-4 h-4"></i>
                        Filtering takeaways for: "<strong>${searchQuery}</strong>"
                    </div>
                ` : ''}

                <section>
                    <h3 class="text-xl font-serif font-bold text-slate-900 mb-6 flex items-center gap-2 border-b border-slate-100 pb-3">
                        <i data-lucide="lightbulb" class="w-5 h-5 text-amber-600"></i>
                        Key Executive Takeaways
                    </h3>
                    <div class="space-y-4">
                        ${(filteredTakeaways.length > 0 ? filteredTakeaways : data.keyTakeaways).map(takeaway => `
                            <div class="p-5 rounded-2xl bg-slate-50/80 hover:bg-slate-50 border border-slate-200/80 text-sm sm:text-base text-slate-700 leading-relaxed flex items-start gap-4 transition-all">
                                <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-600 shrink-0 mt-0.5"></i>
                                <span>${takeaway}</span>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `;

            lucide.createIcons();
        }
    </script>
</body>
</html>
